# VPS-specific overrides for the shared Hostinger box, layered on
# docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml up -d
#
# A host-level nginx (not the prod Caddy service) owns 80/443 and terminates TLS,
# so we publish the API on 127.0.0.1:8090 for nginx to proxy, and DON'T start
# Caddy. The extra environment passthrough wires Brevo SMTP (password reset),
# Nuru AI (Claude primary; Groq/Gemini fallback), Cloudinary uploads, and the
# public app URL — all read from the VPS-only .env (§5.10), never committed.
# Mobile-money credentials (Daraja/M-Pesa), read from the VPS-only .env (§5.10).
#
# THIS IS AN ANCHOR, AND THAT IS THE POINT. It is referenced by BOTH api and
# worker below, because both need it for different halves of the same feature:
# the api starts an STK push when a member gives, and the WORKER charges every
# recurring schedule. Listing the keys under one service only is what caused the
# outage recorded below — and it would be the third such gap in this file, after
# the AI keys (2026-08-01) and SMTP. An anchor makes the two impossible to
# separate by accident.
#
# PRODUCTION OUTAGE FOUND 2026-09-02: these keys were on `api` alone. Six real
# partners set up weekly/monthly M-Pesa giving on 17-18 June and not one cycle
# was ever collected — every run threw "mpesa payments are not configured" from
# the worker, and until migration 211 shipped that failure was swallowed in
# silence. Ten weeks, six givers, zero shillings.
x-mpesa-env: &mpesa-env
  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
  MPESA_PASSKEY: ${MPESA_PASSKEY:-}
  MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
  MPESA_ENV: ${MPESA_ENV:-sandbox}
  MPESA_TX_TYPE: ${MPESA_TX_TYPE:-CustomerPayBillOnline}
  MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://pathway.nuruplace.org/v1/webhooks/mobilemoney/mpesa}

services:
  api:
    ports:
      - "127.0.0.1:8090:8080"
    # Reach host-side services (Icecast :8300, liquidsoap control :1234) from
    # inside the container via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Self-hosted video storage: uploaded bytes land on the host disk (served by
    # nginx at https://pathway.nuruplace.org/media/...), NOT Cloudinary.
    volumes:
      - /var/www/pathway-media:/data/media
      # FCM push (§D-M9): the Firebase Admin service-account JSON, read-only.
      # Path matches FCM_SERVICE_ACCOUNT in the shared backend-env anchor.
      - /opt/pathway/secrets/fcm-service-account.json:/run/secrets/fcm.json:ro
      # Nuru Live recordings: MediaMTX writes fMP4s here on the host; the
      # registrar (inline at /end here, sweep backstop in worker) matches files
      # to streams by time-window and mints recording_url. Without this mount
      # the registrar was silently dead (INCIDENT 2026-07-31: every ended
      # stream had recording_url NULL while the files sat on disk).
      - /opt/pathway/mediamtx/recordings:/opt/pathway/mediamtx/recordings:ro
    environment:
      # Nuru Live CDN (L1.5 / L1.5b). MUST live here, not only in .env — compose
      # only passes what's in an environment block into the container (a scp of
      # this file on 2026-07-31 dropped LIVE_CDN_BASE and silently disabled the
      # R2 fan-out until it was caught). LIVE_CDN_PER_STREAM scopes church HLS
      # objects by stream_id (flicker fix, docs/LIVE_CDN_PERSTREAM.md).
      LIVE_CDN_BASE: ${LIVE_CDN_BASE:-}
      LIVE_CDN_PER_STREAM: ${LIVE_CDN_PER_STREAM:-false}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://pathway.nuruplace.org/media}
      # Live radio via self-hosted Icecast (source-driven). Values from the VPS-only
      # .env; provider falls back to "fake" when unset.
      RADIO_STREAM_PROVIDER: ${RADIO_STREAM_PROVIDER:-fake}
      ICECAST_SOURCE_HOST: ${ICECAST_SOURCE_HOST:-}
      ICECAST_SOURCE_PORT: ${ICECAST_SOURCE_PORT:-}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-}
      ICECAST_PUBLIC_BASE: ${ICECAST_PUBLIC_BASE:-}
      ICECAST_STATUS_URL: ${ICECAST_STATUS_URL:-}
      # Live-mix engine (liquidsoap on the host) — mixer/live/* endpoints.
      LIQUIDSOAP_HOST: ${LIQUIDSOAP_HOST:-}
      LIQUIDSOAP_PORT: ${LIQUIDSOAP_PORT:-1234}
      LIQUIDSOAP_HARBOR_PORT: ${LIQUIDSOAP_HARBOR_PORT:-8005}
      LIQUIDSOAP_HARBOR_MOUNT: ${LIQUIDSOAP_HARBOR_MOUNT:-/mic}
      LIQUIDSOAP_MEDIA_DIR: ${LIQUIDSOAP_MEDIA_DIR:-/var/www/pathway-media}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Claude is the primary provider (buildAiProvider prefers ANTHROPIC_API_KEY
      # when present). Groq/Gemini stay wired as fallbacks so a missing or
      # rate-limited Claude key degrades to a real model rather than to the
      # offline canned responder.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_DEEP: ${ANTHROPIC_MODEL_DEEP:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      # M-Pesa (Daraja) STK push — see x-mpesa-env at the top of this file.
      <<: *mpesa-env
      # nuruplace.org's two signed intakes: the connection card / contact form /
      # prayer request (migration 201), and giving (migration 202). Each must
      # equal its counterpart in /srv/nuruplace/.env — CONTACT_WEBHOOK_SECRET
      # and PATHWAY_GIVING_SECRET respectively.
      #
      # These belong HERE and not only in .env, for the reason this file already
      # records twice above: compose passes a container only what an
      # `environment` block names. Left out, both endpoints read their secret as
      # unset and refuse every request with 503 — the correct failure, and one
      # indistinguishable from a mistyped secret unless you know to look here.
      WEBSITE_CONTACT_WEBHOOK_SECRET: ${WEBSITE_CONTACT_WEBHOOK_SECRET:-}
      WEBSITE_GIVING_WEBHOOK_SECRET: ${WEBSITE_GIVING_WEBHOOK_SECRET:-}
      # Africa's Talking. The WORKER is what sends the giving receipt, so these
      # matter most there (see below) — they are here as well so a future
      # api-side sender (announcement SMS) does not rediscover this file's
      # favourite trap. Nothing in the api sends SMS today.
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
      AFRICASTALKING_ENV: ${AFRICASTALKING_ENV:-sandbox}

  # The worker runs the notification dispatcher (worker.ts → buildDispatchProvider),
  # so it — not the api — is what actually sends FCM pushes. Mount the same
  # read-only service-account file here; FCM_SERVICE_ACCOUNT (shared anchor) points
  # at it. All other env comes from the base *backend-env anchor in prod.yml.
  worker:
    # PRODUCTION BUG FOUND 2026-08-01: the worker had NO AI provider env at all,
    # so buildAiProvider() fell through to FakeAiProvider — the Sunday Letter and
    # the nightly story narrative were canned offline text, not model output, and
    # nothing surfaced that because the fallback is deliberately silent. The
    # worker is the process that RUNS those jobs, so it needs the keys too.
    environment:
      # The worker runs runDueSchedules — it is the process that actually
      # collects every recurring gift, so it needs the mobile-money keys just as
      # much as the api does. Absent here from the day recurring giving shipped
      # until 2026-09-02; see x-mpesa-env at the top of this file.
      <<: *mpesa-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_DEEP: ${ANTHROPIC_MODEL_DEEP:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # The WORKER is the process that dispatches notifications, so it — not the
      # api — is what actually needs SMTP. Without these, giving receipts scheduled
      # on channel:"email" cannot be delivered. (Same class of gap as the AI keys
      # above: this compose file gave `api` a full environment and the worker
      # almost none, so every worker-side integration silently no-opped.)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      # Africa's Talking SMS. THIS is the process that sends the giving receipt
      # — a website giver has no account, so no notifications row can reach
      # them, and the worker drains the outbox job that texts them instead.
      # Missing here and the receipt silently never sends, which is the same
      # class of gap as the SMTP one recorded just above.
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
      AFRICASTALKING_ENV: ${AFRICASTALKING_ENV:-sandbox}
    volumes:
      - /opt/pathway/secrets/fcm-service-account.json:/run/secrets/fcm.json:ro
      # rw: the sweep registers recordings AND (follow-up) unlinks soft-deleted ones.
      - /opt/pathway/mediamtx/recordings:/opt/pathway/mediamtx/recordings
