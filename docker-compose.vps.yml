# VPS-specific overrides for the shared Hostinger box, layered on
# docker-compose.prod.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.vps.yml up -d
#
# A host-level nginx (not the prod Caddy service) owns 80/443 and terminates TLS,
# so we publish the API on 127.0.0.1:8090 for nginx to proxy, and DON'T start
# Caddy. The extra environment passthrough wires Brevo SMTP (password reset),
# Nuru AI (Groq/Gemini), Cloudinary uploads, and the public app URL — all read
# from the VPS-only .env (§5.10), never committed.
services:
  api:
    ports:
      - "127.0.0.1:8090:8080"
    # Reach host-side services (Icecast :8300, liquidsoap control :1234) from
    # inside the container via host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Self-hosted video storage: uploaded bytes land on the host disk (served by
    # nginx at https://pathway.nuruplace.org/media/...), NOT Cloudinary.
    volumes:
      - /var/www/pathway-media:/data/media
      # FCM push (§D-M9): the Firebase Admin service-account JSON, read-only.
      # Path matches FCM_SERVICE_ACCOUNT in the shared backend-env anchor.
      - /opt/pathway/secrets/fcm-service-account.json:/run/secrets/fcm.json:ro
      # Nuru Live recordings: MediaMTX writes fMP4s here on the host; the
      # registrar (inline at /end here, sweep backstop in worker) matches files
      # to streams by time-window and mints recording_url. Without this mount
      # the registrar was silently dead (INCIDENT 2026-07-31: every ended
      # stream had recording_url NULL while the files sat on disk).
      - /opt/pathway/mediamtx/recordings:/opt/pathway/mediamtx/recordings:ro
    environment:
      # Nuru Live CDN (L1.5 / L1.5b). MUST live here, not only in .env — compose
      # only passes what's in an environment block into the container (a scp of
      # this file on 2026-07-31 dropped LIVE_CDN_BASE and silently disabled the
      # R2 fan-out until it was caught). LIVE_CDN_PER_STREAM scopes church HLS
      # objects by stream_id (flicker fix, docs/LIVE_CDN_PERSTREAM.md).
      LIVE_CDN_BASE: ${LIVE_CDN_BASE:-}
      LIVE_CDN_PER_STREAM: ${LIVE_CDN_PER_STREAM:-false}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/data/media}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://pathway.nuruplace.org/media}
      # Live radio via self-hosted Icecast (source-driven). Values from the VPS-only
      # .env; provider falls back to "fake" when unset.
      RADIO_STREAM_PROVIDER: ${RADIO_STREAM_PROVIDER:-fake}
      ICECAST_SOURCE_HOST: ${ICECAST_SOURCE_HOST:-}
      ICECAST_SOURCE_PORT: ${ICECAST_SOURCE_PORT:-}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-}
      ICECAST_PUBLIC_BASE: ${ICECAST_PUBLIC_BASE:-}
      ICECAST_STATUS_URL: ${ICECAST_STATUS_URL:-}
      # Live-mix engine (liquidsoap on the host) — mixer/live/* endpoints.
      LIQUIDSOAP_HOST: ${LIQUIDSOAP_HOST:-}
      LIQUIDSOAP_PORT: ${LIQUIDSOAP_PORT:-1234}
      LIQUIDSOAP_HARBOR_PORT: ${LIQUIDSOAP_HARBOR_PORT:-8005}
      LIQUIDSOAP_HARBOR_MOUNT: ${LIQUIDSOAP_HARBOR_MOUNT:-/mic}
      LIQUIDSOAP_MEDIA_DIR: ${LIQUIDSOAP_MEDIA_DIR:-/var/www/pathway-media}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_TLS_SERVERNAME: ${SMTP_TLS_SERVERNAME}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      # Claude is the primary provider (buildAiProvider prefers ANTHROPIC_API_KEY
      # when present). Groq/Gemini stay wired as fallbacks so a missing or
      # rate-limited Claude key degrades to a real model rather than to the
      # offline canned responder.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_DEEP: ${ANTHROPIC_MODEL_DEEP:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      # M-Pesa (Daraja) STK push — read from the VPS-only .env (§5.10). The provider
      # is "ready" only when key+secret+passkey+shortcode+callback URL are all set.
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_TX_TYPE: ${MPESA_TX_TYPE:-CustomerPayBillOnline}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-https://pathway.nuruplace.org/v1/webhooks/mobilemoney/mpesa}

  # The worker runs the notification dispatcher (worker.ts → buildDispatchProvider),
  # so it — not the api — is what actually sends FCM pushes. Mount the same
  # read-only service-account file here; FCM_SERVICE_ACCOUNT (shared anchor) points
  # at it. All other env comes from the base *backend-env anchor in prod.yml.
  worker:
    # PRODUCTION BUG FOUND 2026-08-01: the worker had NO AI provider env at all,
    # so buildAiProvider() fell through to FakeAiProvider — the Sunday Letter and
    # the nightly story narrative were canned offline text, not model output, and
    # nothing surfaced that because the fallback is deliberately silent. The
    # worker is the process that RUNS those jobs, so it needs the keys too.
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_MODEL_FAST: ${ANTHROPIC_MODEL_FAST:-claude-haiku-4-5-20251001}
      ANTHROPIC_MODEL_DEEP: ${ANTHROPIC_MODEL_DEEP:-claude-opus-5}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - /opt/pathway/secrets/fcm-service-account.json:/run/secrets/fcm.json:ro
      # rw: the sweep registers recordings AND (follow-up) unlinks soft-deleted ones.
      - /opt/pathway/mediamtx/recordings:/opt/pathway/mediamtx/recordings
