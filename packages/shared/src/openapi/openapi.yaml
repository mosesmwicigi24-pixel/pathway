  # --- Module reflections (Contract Matrix B3) ---
  /modules/{id}/reflection:
    get:
      tags: [assessment]
      summary: The member's saved standalone reflection for a module (null when none). Unlock-gated like getModule.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: The saved reflection, or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [body, created_at]
                        properties:
                          body: { type: string }
                          created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GateLocked" }
    post:
      tags: [assessment]
      summary: >-
        Write (or overwrite) the member's reflection on a module — one of the content
        steps the quiz / mark-complete gate requires (read → watch → listen → reflect).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [body, created_at]
                    properties:
                      body: { type: string }
                      created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GateLocked" }
  /modules/{id}/reflection/review:
    get:
      tags: [assessment]
      summary: The member's own module-reflection review state + reviewer feedback (never the pastoral note).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Reflection review state }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reflections:
    get:
      tags: [portal]
      summary: Leader+. Module-reflection review queue (cell-scoped; state + overdue filters).
      responses:
        "200": { description: Queue }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/reflections/{id}/decision:
    post:
      tags: [portal]
      summary: Leader+. Approve / return (feedback required, re-locks gating) / defer. Audited; notifies member (+multiplier).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Decided }
        "400": { description: Validation failed }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reflections/{id}/history:
    get:
      tags: [portal]
      summary: Leader+. The audited decision trail for one reflection.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: History }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

