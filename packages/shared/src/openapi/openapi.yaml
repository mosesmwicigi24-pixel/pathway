        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Member staff state
          content:
            application/json:
              schema:
                type: object
                required: [user_id, full_name, is_staff, role]
                properties:
                  user_id: { type: string, format: uuid }
                  full_name: { type: string }
                  is_staff: { type: boolean }
                  role: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/members/{id}/demote:
    post:
      tags: [portal]
      summary: Admin. Demote a portal-elevated member — clears users.is_staff AND removes every RBAC role assignment + direct permission grant, so they fully lose portal access and drop off System ▸ Users. Membership + member-app access untouched. Idempotent. Audited. (users:create).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Member staff state
          content:
            application/json:
              schema:
                type: object
                required: [user_id, full_name, is_staff, role]
                properties:
                  user_id: { type: string, format: uuid }
                  full_name: { type: string }
                  is_staff: { type: boolean }
                  role: { type: string }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
