        "401": { $ref: "#/components/responses/Unauthorized" }
  /growth/plans:
    get:
      tags: [progress]
      summary: Reading plans with my enrollment + progress.
      responses:
        "200": { description: Plans }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /growth/plans/{id}:
    get:
      tags: [progress]
      summary: >-
        Reading-plan detail with days and my progress. Each day carries `locked`
        — true while an earlier day is unfinished. A locked day keeps its shape
        (title, reference, the kinds of its parts) but its `content` and
        `video_url` come back null on the day and every segment, so no client can
        render past the gate. `next_day` is the first unfinished day (null when
        the plan is done).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Plan }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /growth/plans/{id}/start:
    post:
      tags: [progress]
      summary: Enroll in a reading plan (idempotent).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201": { description: Enrolled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /growth/plans/{id}/complete-day:
    post:
      tags: [progress]
      summary: >-
        Seal a reading-plan day. The client asks; the SERVER decides (§1.1) — a
        day is finished when its parts are, never on the client's say-so.
        Idempotent: re-sealing a finished day returns the same progress.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [day_number]
              properties:
                day_number: { type: integer, minimum: 1 }
      responses:
        "200": { description: Progress }
        "400": { description: "VALIDATION_FAILED — day beyond the plan length" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "NOT_FOUND — no such plan, or that day is not in it" }
        "409":
          description: >-
            CONTENT_INCOMPLETE — parts of this day are still unread
            (details.parts_remaining), or GATE_LOCKED — an earlier day is
            unfinished (details.next_day names the day to go back to).
  /growth/plans/{planId}/days/{dayNumber}/reflection:
    get:
      tags: [progress]
      summary: My reflection for a reading-plan day (null when I haven't written one).
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Reflection or null
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { $ref: "#/components/schemas/PlanDayReflection" }
                      - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [progress]
      summary: Write my reflection for a reading-plan day. Upsert per (user, plan, day); idempotent per client_mutation_id (§2.1).
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
                client_mutation_id: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: The saved reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanDayReflection" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /growth/plans/{planId}/days/{dayNumber}/talk:
    get:
      tags: [progress]
      summary: The day's shared "Talk it Over" conversation (author, like count, my-like flag), oldest first.
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: "{ data: TalkPost[] } - post_id, day_number, body, created_at, user_id, name, avatar_url, like_count, liked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [progress]
      summary: Add my response to the day's Talk it Over conversation.
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: The saved response row (same shape as the list items) }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /growth/plans/{planId}/days/{dayNumber}/talk/assist:
    post:
      tags: [progress]
      summary: AI compose help for my Talk it Over response — returns a SUGGESTION for the member to edit; nothing is posted or persisted.
      parameters:
        - { name: planId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dayNumber, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                draft: { type: string, maxLength: 2000, description: "The member's own words — polished, never replaced. Omit to get a first-person starter from the day's questions." }
      responses:
        "200": { description: "{ suggestion }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: Assistant unavailable (no provider key / upstream down) }
  /growth/talk/{id}/like:
    post:
      tags: [progress]
      summary: Toggle my encouragement heart on a Talk it Over response.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ liked, like_count }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /growth/segments/{id}/complete:
    post:
      tags: [progress]
      summary: >-
        Mark one reading-plan day PART complete (YouVersion reader); rolls the
        day up when all of them are done. Gated the same way as sealing the day —
        the day CTA is not the only door in.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: >-
            { segment_id, day_number, day_completed, day_complete,
            next_day_number, next_day_unlocked, progress }. day_complete and
            day_completed are the same value (day_complete is the current
            name; day_completed is kept for older clients). next_day_number /
            next_day_unlocked are computed in the same transaction as the
            write, so a client acting on the LAST segment's response — rather
            than re-fetching the plan — never sees a stale "locked" answer
            from a completion still in flight through the offline queue.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            GATE_LOCKED — this part belongs to a day that has not opened yet
            because an earlier day is unfinished (details.next_day).
  /growth/resources:
    get:
      tags: [progress]
      summary: Resource library (books / audio / video / articles).
      responses:
        "200": { description: Resources }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /growth/mentor:
    get:
      tags: [progress]
      summary: My discipler (from the relationship tree) + meeting notes.
      responses:
        "200": { description: Mentor }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Reading & Social R1: "Read with a Friend" (spec §3/§6) ---
  /reading/groups:
    post:
      tags: [progress]
      summary: >-
        Create-or-get my shared plan group for a plan. If I already have an
        active group for this plan_id, that SAME group is returned (never a
        duplicate). Any member_user_ids named must already be an accepted
        connection of mine (else 403 CONSENT_REQUIRED, details.hint =
        "connect first") and are sent a targeted invite (idempotent — an
        existing pending invite to the same person is a no-op).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_id]
              properties:
                plan_id: { type: string, format: uuid }
                member_user_ids: { type: array, maxItems: 7, items: { type: string, format: uuid } }
                name: { type: string, maxLength: 120 }
      responses:
        "201": { description: "Group — { group_id, plan_id, created_by, name, created_at, archived_at, plan, members: [...] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE (minor-safety) or CONSENT_REQUIRED (an entry in member_user_ids is not yet an accepted connection)." }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [progress]
      summary: My active shared plan groups — plan summary + full member list, each with current_day/completed_days/days_done/completed_at (scoped to co-members of the same group, never a bare private-progress lookup).
      responses:
        "200": { description: "{ data: [Group, ...] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /reading/groups/{id}:
    get:
      tags: [progress]
      summary: Full group detail — active member only. 403 (not 404) for a non-member, so a stray id never confirms a group's existence to a stranger.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Group }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reading/groups/{id}/archive:
    post:
      tags: [progress]
      summary: End a shared plan — creator only. Soft state; membership + history are kept. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ group_id, archived_at }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reading/groups/{id}/leave:
    post:
      tags: [progress]
      summary: Leave a shared plan group — any active member (including the creator; ownership is not reassigned). Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ group_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reading/groups/{id}/invites:
    post:
      tags: [progress]
      summary: >-
        Mint an invite in an existing group — active member only. user_id set
        → targeted invite (requires an already-accepted connection, else 403
        CONSENT_REQUIRED). user_id omitted → mints a fresh open share-link
        invite (no connection gate, no expiry) that MULTIPLE friends may
        redeem, since it never leaves 'pending' on accept. Idempotent on
        client_mutation_id.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                message: { type: string, maxLength: 500 }
                client_mutation_id: { type: string, format: uuid }
      responses:
        "201": { description: Invite }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "CONFLICT — already an active member, or the group has ended." }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [progress]
      summary: Pending + past invites for a group — active member only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ data: [Invite, ...] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reading/groups/{id}/invites/{invite_id}/revoke:
    post:
      tags: [progress]
      summary: Revoke a pending invite — the inviter or the group's creator. Idempotent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: invite_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ invite_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /reading/invites/{token}:
    get:
      tags: [progress]
      summary: Authenticated in-app invite preview (plan title/cover/description/day_count, inviter name, message, active member_count) — what the app calls right after a deep link opens it while logged in.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: InvitePreview }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "NOT_FOUND — unknown, expired, revoked, or declined token." }
  /reading/invites/{token}/accept:
    post:
      tags: [progress]
      summary: >-
        Redeem an invite: joins the group, enrolls in the underlying plan,
        and establishes an accepted connection with the inviter if none
        exists yet (creates one on the spot rather than requiring it
        pre-exist — docs/READING_SOCIAL_PLAN.md Open Question 2). A targeted
        invite must belong to the caller (else 403). Idempotent: replaying an
        already-accepted targeted invite by the same caller is a no-op; an
        open-link invite never leaves 'pending', so it stays redeemable by
        other friends.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ group_id, status, joined }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE — this invite targets someone else, the connection is blocked, or a minor is involved." }
        "404": { description: "NOT_FOUND — unknown, expired, revoked, or declined token." }
        "409": { description: "CONFLICT — the shared plan has ended." }
  /reading/invites/{token}/decline:
    post:
      tags: [progress]
      summary: Decline a targeted invite — the named invitee only (403 on an open share-link — there is no single party to decline it for everyone).
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /join/{token}:
    get:
      tags: [progress]
      summary: >-
        PUBLIC, unauthenticated deep-link landing page (spec §6). Not a JSON
        route — server-rendered HTML with OpenGraph/Twitter-card meta (plan
        title, cover image, description, day count, inviter first name),
        escaped against XSS, plus an inline script that attempts the app's
        `nuru://` custom-scheme deep link and falls back to the platform
        store after ~1.2s. A crawler (WhatsApp/iMessage preview bots) reads
        only the meta tags and never runs the script. Bad/expired/revoked/
        declined tokens render a friendly 404 HTML page, never the JSON error
        envelope.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "OG-rich HTML landing page", content: { text/html: { schema: { type: string } } } }
        "404": { description: "HTML 404 page — unknown, expired, revoked, or declined token.", content: { text/html: { schema: { type: string } } } }

