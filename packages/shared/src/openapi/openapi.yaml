  /admin/members/{id}/walk:
    get:
      tags: [adminops]
      summary: "The member's whole journey (Wave 3 walk thread) for the portal Member Profile — began, modules, reflections, levels, certificates, verses, plans, badges. Same truth the member sees."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ data: [{ kind, title, detail, quote, occurred_at }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/analytics/intelligence:
    get:
      tags: [portal]
      summary: >-
        SuperAdmin/Admin. Member Intelligence aggregate — giving behaviour (avg
        per transaction, frequency, funds, methods, top givers), a devices block
        (platforms, app_versions, models: top device models as {model, members}
        with members = distinct members per model, top 8; model_capture: true only
        once a model-aware client has registered a non-null model, else false),
        engagement bands + activity by kind/hour plus area_dwell (top app areas
        by total dwell time over the last 30 days as {screen, total_ms, sessions,
        members}, top 10; screen_dwell_capture: true only once a dwell-aware
        client has posted at least one screen event, else false), an activity block
        (active_trend: distinct active users per ISO week for the last 12 weeks;
        active_days: distribution of per-user distinct active-day counts over the
        last 30 days, the login-frequency proxy, bucketed 1 | 2-3 | 4-7 | 8-15 |
        16+), curriculum + Word growth, and coarse location. Prayer excluded
        (§5.4); uncaptured metrics flagged.
      responses:
        "200": { description: Intelligence aggregate }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
