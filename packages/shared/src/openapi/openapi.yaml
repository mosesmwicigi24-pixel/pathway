  # --- Chat: DMs, cell groups, public spaces (mobile Chat make) ---
  /chat/conversations:
    get:
      tags: [progress]
      summary: My chat inbox — DMs, cell groups, joined spaces (with unread + preview) plus discoverable spaces.
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [conversations, discover_spaces]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/ChatConversationSummary" }
                  discover_spaces:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/conversations/{id}:
    get:
      tags: [progress]
      summary: A conversation's messages (reactions, reply previews); 404 outside my membership/scope (no existence leak). Head carries `type` (Chat Redesign C4) alongside `kind`.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "Conversation — head includes type: SPACE|DIRECT|DISCIPLER|PASTORAL|BROADCAST|BROADCAST_RESPONSE, plus muted: boolean (migration 172, mine only)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/conversations/{id}/messages:
    post:
      tags: [progress]
      summary: Send a message (client-generated id; offline-queueable; idempotent on client_mutation_id).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/conversations/{id}/read:
    post:
      tags: [progress]
      summary: Mark a conversation read (clears unread); offline-queueable.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Read }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/conversations/{id}/mute:
    put:
      tags: [progress]
      summary: >-
        Mute this conversation's push nudges for me (Chat Redesign C4,
        migration 172) — active participant only; idempotent (re-muting
        overwrites the prior expiry). Suppresses every typed nudge
        (chat_dm_message / chat_discipler_message / chat_pastoral_message /
        chat_broadcast) for this recipient in this conversation while active;
        never affects the other participant, in-app unread state, or message
        delivery itself.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                until:
                  type: [string, "null"]
                  format: date-time
                  description: "ISO timestamp to mute through; omitted or null = muted forever."
      responses:
        "200": { description: "{ conversation_id, muted: true, muted_until }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      summary: Unmute (Chat Redesign C4, migration 172) — active participant only; idempotent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ conversation_id, muted: false }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/reactions:
    post:
      tags: [progress]
      summary: Toggle a reaction emoji on a message; offline-queueable.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Toggled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/readers:
    get:
      tags: [progress]
      summary: Read receipts for my message — who has seen it (author-only).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Readers + recipient/read counts }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/report:
    post:
      tags: [progress]
      summary: >-
        Report a message (Chat Redesign C4) — any ACTIVE participant of its
        conversation, once (idempotent per reporter+message). Sets the
        message's is_flagged so it surfaces in the existing Admin moderation
        queue's `flagged` count — no parallel queue.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string, maxLength: 500 } }
      responses:
        "201": { description: "{ message_id, reported: true, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}:
    patch:
      tags: [progress]
      summary: Edit my own message body (author-only); sets the edited flag.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Edited }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [progress]
      summary: Soft-delete my own message (author-only); removed from all reads.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/people:
    get:
      tags: [progress]
      summary: DM directory — members I may message (same congregation, minor-safe; excludes self). Optional ?q name search. Each row carries public achievement flair — level + counts only, never private detail.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: object
                required: [people]
                properties:
                  people:
                    type: array
                    items:
                      type: object
                      required: [user_id, full_name, level, badge_count, badge_icons, cert_count]
                      properties:
                        user_id: { type: string, format: uuid }
                        full_name: { type: string }
                        role: { type: string }
                        avatar_url: { type: ["string", "null"] }
                        congregation:
                          type: ["string", "null"]
                          description: Present only for portal-staff (Admin/SuperAdmin) callers — global directory rows.
                        level:
                          type: integer
                          description: Pathway level (enrollments.current_level; 1 when not yet enrolled).
                        badge_count:
                          type: integer
                          description: Count of unrevoked badges. Public aggregate only.
                        badge_icons:
                          type: array
                          maxItems: 3
                          items: { type: string }
                          description: Icon strings (badges.icon_key) of the up-to-3 most recently awarded badges; empty when none carry an icon.
                        cert_count:
                          type: integer
                          description: Count of issued certificates. Public aggregate only.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/dms:
    post:
      tags: [progress]
      summary: >-
        Open (or fetch) a 1:1 DM with another member; minor-safe (D-M6); same
        congregation. Chat Redesign C1/C2 (docs/CHAT_REDESIGN.md): an EXISTING
        thread (including any DM grandfathered as an accepted connection by
        migration 162's backfill) is always just returned. Creating a NEW
        thread between two ordinary members now requires an accepted
        connection first (403 CONSENT_REQUIRED, details.hint = "send a
        connection request first") — see /chat/connections/requests. Staff
        (Admin/SuperAdmin) keep the "reach anyone" support exception on either
        side of the pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "201": { description: Conversation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: FORBIDDEN_SCOPE (minor-safety, or cross-congregation) or CONSENT_REQUIRED (no accepted connection for a brand-new thread).
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/discipler/conversation:
    get:
      tags: [progress]
      summary: >-
        My Discipler (Chat Redesign C2): resolve — lazily creating — my
        DISCIPLER thread with my CURRENT assignment (discipler_assignments,
        falling back to a not-yet-migrated relationship_tree edge — NEVER the
        cell-leader inference). Minor-safe (D-M6). Never reuses an ARCHIVED
        thread from a prior assignment.
      responses:
        "200": { description: "{ conversation_id }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { description: "NOT_FOUND, details.no_discipler = true — no valid discipler assignment exists." }
  /chat/connections/requests:
    post:
      tags: [progress]
      summary: >-
        Ask to connect with another member — the consent handshake in front of
        Chat (Chat Redesign C1/C2). Minor-safe (D-M6). If the OTHER party
        already has a pending ask to the caller, both sides resolve to
        accepted immediately (a mutual ask). 409 CONFLICT if a request is
        already pending in either direction, or the pair is already connected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
                message: { type: string, maxLength: 500 }
                client_mutation_id: { type: string, format: uuid, description: Replays with the same id are no-ops. }
      responses:
        "201": { description: "{ request_id, status, duplicate, mutual }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "CONFLICT — already pending, or already connected." }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [progress]
      summary: My pending connection requests, incoming or outgoing.
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
      responses:
        "200": { description: "{ data: [{ request_id, status, message, created_at, user_id, full_name, avatar_url }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/connections/requests/{id}/accept:
    post:
      tags: [progress]
      summary: Accept a connection request — recipient only. Creates the accepted connection (does NOT auto-create the DM; POST /chat/dms still does that, now gated on this).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ request_id, status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/connections/requests/{id}/decline:
    post:
      tags: [progress]
      summary: Decline a connection request — recipient only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ request_id, status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/connections/requests/{id}:
    delete:
      tags: [progress]
      summary: Cancel a still-pending request I sent — requester only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ request_id, status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/connections:
    get:
      tags: [progress]
      summary: My accepted connections — who I can already chat with.
      responses:
        "200": { description: "{ data: [{ user_id, full_name, avatar_url, status, established_at }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/connections/{user_id}/remove:
    post:
      tags: [progress]
      summary: Remove an accepted connection — either party. Existing DM history is kept (no-data-loss); a NEW thread needs a fresh accepted connection.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ user_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/connections/{user_id}/block:
    post:
      tags: [progress]
      summary: Block a member — stops NEW sends in both directions (existing history stays readable). Cancels any pending request between them.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ user_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /chat/connections/{user_id}/unblock:
    post:
      tags: [progress]
      summary: Unblock — blocker only. Reverts to "removed" (not connected); a fresh request is needed to chat again.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ user_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/pastoral:
    post:
      tags: [progress]
      summary: >-
        Talk with My Pastor (Chat Redesign C2): create-or-open MY thread with
        my CURRENT pastor. Resolution order: my own active assignment → my
        congregation's active default → the congregation's earliest-created
        SuperAdmin (audit-logged every time this last-resort fallback actually
        fires). No step-up — this is my own conversation.
      responses:
        "201": { description: "{ conversation_id, pastor_user_id, source }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { description: "NOT_FOUND, details.no_pastor = true — no pastor resolves at all (no assignment, no default, no SuperAdmin)." }
  /chat/pastoral/eligibility:
    get:
      tags: [progress]
      summary: >-
        Side-effect-free probe (Chat Redesign C4): have I EVER held a
        pastor_assignments row as the pastor? No step-up (unlike the inbox
        below) — reveals nothing private, only whether the Pastoral Inbox tab
        applies to me. For a non-SuperAdmin assigned pastor's client to show
        its own inbox entry without a failed, step-up-gated request first.
      responses:
        "200": { description: "{ is_pastor: boolean }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/pastoral/inbox:
    get:
      tags: [progress]
      summary: >-
        Pastoral Inbox ("Talk with Your Pastor"): every PASTORAL thread the
        caller is the pastor of, or every PASTORAL thread for a SuperAdmin's
        oversight reach. Refused (403) for anyone who has never held a pastor
        assignment and isn't SuperAdmin. Password step-up required (§5.3) —
        same posture as Broadcast.
      responses:
        "200": { description: "{ data: [{ conversation_id, archived_at, updated_at, member_user_id, member_name, member_avatar_url, last_body, last_at }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE — no pastor assignment on file and not SuperAdmin, OR password_required (step-up)." }
  /chat/broadcast:
    post:
      tags: [progress]
      summary: >-
        Broadcast — Admin+ ONLY. Not Instructor; a cell leader is a member who is
        not an admin, and the Broadcast does not exist for them (no tab, and 403
        here if they ask anyway). Delivers ONE message to every active member as
        an individual DM from the sender (no group room; replies return as normal
        1:1 threads, private to the sender). Minors excluded (D-M6). Idempotent on
        client_mutation_id. May carry an image (msg_type=image + attachment_url
        uploaded via /chat/attachments/sign) — body is then the caption. Recorded
        as a chat_broadcasts row, so the send is addressable afterwards via
        /chat/broadcasts. Password step-up required (§5.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 20000, description: "The message text (the caption, for an image broadcast)." }
                msg_type: { type: string, enum: [text, image], default: text }
                attachment_url: { type: string, format: uri, maxLength: 2000, description: Cloudinary secure_url of the uploaded image (the caption travels in body). }
                audience:
                  type: string
                  enum: [congregation, all]
                  description: >-
                    Who it reaches. OMIT IT and the server picks the honest default
                    for who you are — a SuperAdmin means the whole church ("all"),
                    anyone else means their own congregation. There is deliberately
                    no schema default: one would be applied before the service sees
                    the request, making "didn't say" indistinguishable from "said
                    congregation" — which is exactly how a SuperAdmin's broadcast
                    quietly reached 40 of 60 members, the other 19 having no
                    congregation to be scoped to. "all" is SuperAdmin-only however
                    it arrives; anyone else asking for it gets 403 FORBIDDEN_SCOPE.
                reply_policy:
                  type: string
                  enum: [none, official_inbox, ordinary_chat, linked_thread]
                  default: ordinary_chat
                  description: >-
                    Chat Redesign C2. Omit it and today's exact behaviour is
                    unchanged (ordinary_chat — the recipient may reply freely
                    in the shared thread). 'none'/'official_inbox' refuse the
                    recipient's reply with 403 FORBIDDEN_SCOPE, details.reply_policy
                    set accordingly (the broadcaster is never gated). 'linked_thread'
                    also refuses the shared-thread reply, but resolves
                    details.linked_conversation_id to the recipient's DISCIPLER
                    or PASTORAL thread with the sender when one applies (null
                    otherwise) — the client re-sends there instead.
                client_mutation_id: { type: string, format: uuid, description: Replays with the same id are no-ops. }
      responses:
        "201":
          description: >-
            The message AS SENT — the same shape /chat/broadcasts/{id} returns, so
            the UI pins it at the top of its page immediately, with the server's
            timestamp and the count it actually reached. Sending never needs a
            second round trip to find out what you just said. A replay returns it
            whole too, not a bare id the client cannot draw.
          content:
            application/json:
              schema:
                type: object
                properties:
                  broadcast_id: { type: string, format: uuid, description: "The send itself — pass to /chat/broadcasts/{id} to see who answered." }
                  body: { type: string, description: "What you said (the caption, for an image broadcast)." }
                  msg_type: { type: string, enum: [text, voice, image, file, video] }
                  attachment_url: { type: [string, "null"] }
                  audience: { type: string, enum: [congregation, all] }
                  recipient_count: { type: integer, description: "How many members it reached, recorded at send time." }
                  reply_policy: { type: string, enum: [none, official_inbox, ordinary_chat, linked_thread] }
                  created_at: { type: string, format: date-time, description: "The server's timestamp — display this, not the device clock." }
                  sent: { type: integer, description: "Same as recipient_count; kept for callers that read it." }
                  duplicate: { type: boolean, description: "True when a replayed client_mutation_id short-circuited. Everything else is what actually landed, not a recount of today's membership." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /chat/cells/{id}/conversation:
    post:
      tags: [progress]
      summary: Open (provisioning on first use) a cell's group room (Instructor+; scoped to leader_assignments — Admin passes). Backs the portal "Message cell" action.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201": { description: Conversation }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces:
    post:
      tags: [progress]
      summary: Leader curates a public space for the congregation (Instructor+); optional category tag (e.g. youth, marketplace).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, title]
              properties:
                conversation_id: { type: string, format: uuid }
                title: { type: string, minLength: 3, maxLength: 200 }
                topic: { type: string, maxLength: 300 }
                category: { type: string, maxLength: 24 }
                requires_approval:
                  type: boolean
                  default: false
                  description: >-
                    Chat Redesign C4 (migration 170). FALSE (default) is
                    today's instant-join behaviour. TRUE refuses a direct
                    POST /chat/spaces/{id}/join (403 FORBIDDEN_SCOPE,
                    details.approval_required=true) for anyone not already an
                    active member — the client falls back to
                    POST /chat/spaces/{id}/join-requests for leader review.
                client_mutation_id: { type: string, format: uuid, description: Replays with the same id are no-ops. }
      responses:
        "201": { description: Created }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /chat/attachments/sign:
    post:
      tags: [progress]
      summary: Broker a signed direct-upload URL for a chat attachment (bytes go to Cloudinary, never our server). Returns object_key to reference in a message.
      responses:
        "201": { description: Signed upload }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /chat/spaces/{id}/join:
    post:
      tags: [progress]
      summary: >-
        Join a public space in my congregation. Chat Redesign C4: refused
        (403 FORBIDDEN_SCOPE, details.approval_required=true) when the space
        has requires_approval=true and I'm not already an active member — use
        POST /chat/spaces/{id}/join-requests instead. Never applies to a
        cell's own room: active cell members always direct-join it (unchanged,
        access()'s auto-join).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Joined }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE, details.approval_required=true — this space requires leader review; use join-requests instead." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "UNPROCESSABLE — not a space (e.g. a cell room, which has no direct-join route at all)." }
  /chat/spaces/{id}/join-requests:
    post:
      tags: [progress]
      summary: >-
        Ask to join a space that doesn't auto-entitle me (a cell room I'm not
        currently in, or a topical space) — Chat Redesign C1/C2. A no-op
        success if I'm already an active member. Notifies the space's
        leadership (original leader + any delegated leader/moderator).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { message: { type: string, maxLength: 500 } }
      responses:
        "201": { description: "{ status: already_member|pending, request_id? }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [progress]
      summary: Pending join requests for a space — leader/delegated moderator/Admin+ only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: "{ data: [{ request_id, user_id, full_name, avatar_url, message, requested_at }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/join-requests/{reqId}/accept:
    post:
      tags: [progress]
      summary: Accept a space join request — leader/delegated moderator/Admin+ only. Adds (or revives) an active chat_members row.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: reqId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ request_id, status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/join-requests/{reqId}/decline:
    post:
      tags: [progress]
      summary: Decline a space join request — leader/delegated moderator/Admin+ only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: reqId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ request_id, status, already }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/roles:
    post:
      tags: [progress]
      summary: Delegate a co-leader/moderator role for a space — leader-level power only (original leader, a delegated leader, or Admin+; a delegated moderator cannot grant roles).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role]
              properties:
                user_id: { type: string, format: uuid }
                role: { type: string, enum: [leader, moderator] }
      responses:
        "201": { description: "{ conversation_id, user_id, role }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/roles/{user_id}/{role}:
    delete:
      tags: [progress]
      summary: Revoke a delegated space role — leader-level power only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: role, in: path, required: true, schema: { type: string, enum: [leader, moderator] } }
      responses:
        "200": { description: "{ conversation_id, user_id, role, revoked }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/members/{user_id}/remove:
    post:
      tags: [progress]
      summary: Remove a member from a space — leader/delegated moderator/Admin+ only. History is kept (chat_members.status), not deleted.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ conversation_id, user_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/spaces/{id}/members/{user_id}/suspend:
    post:
      tags: [progress]
      summary: Suspend a member from a space — leader/delegated moderator/Admin+ only.
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ conversation_id, user_id, status }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/conversations/{id}/invite:
    post:
      tags: [progress]
      summary: >-
        Bring one more person into ONE thread — never into the broadcast.
        SuperAdmin only, and only a thread they are already in: the unit of
        authorisation is deliberately the conversation, so authorising a deacon
        for one member's reply grants them nothing anywhere else. The member is
        TOLD — a note lands in the thread naming who joined, because someone who
        wrote privately to their pastor is owed the knowledge that another person
        is now reading. A dm becomes a group on the first invite (a dm's title is
        "the other member", which is meaningless once there are two of them).
        Minors are refused (D-M6).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "201": { description: "{ conversation_id, invited, already } — already=true when they were in it (no second notice)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE — not a SuperAdmin, not in this thread, or the invitee is a minor." }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /chat/broadcasts:
    get:
      tags: [progress]
      summary: >-
        My broadcasts, newest first — the LAST 4 by default, because that is what
        is still live enough to watch. Each carries recipient_count (how many it
        reached, at send time), seen_count (how many have opened it) and
        replied_count (how many answered). SuperAdmin only: the whole thing is a
        conversation between the SuperAdmin and one member, and nobody else is in
        it (§5.4). Password step-up required (§5.3).
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 4 }
          description: How many to return. Ask for more when the member taps "show all".
      responses:
        "200":
          description: >-
            { data: [{ broadcast_id, body, msg_type, attachment_url, audience,
            recipient_count, seen_count, replied_count, created_at }], total } —
            `total` is every broadcast you have sent, so "show all N" can name its
            number rather than guess.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE — SuperAdmin only, or the password step-up is missing/stale (details.password_required)." }
  /chat/broadcasts/{id}:
    get:
      tags: [progress]
      summary: >-
        One broadcast: the message, then every response to it. A response is any
        message a recipient wrote in their delivered copy's conversation after it
        landed — no reply table exists or is needed. Each response carries the
        conversation_id of the private thread it came from, ALREADY seeded with
        the broadcast as its top message, so promoting a response to a full
        conversation is a navigation rather than a creation.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: >-
            The broadcast, its responses, and its ticks.
            responses[] — every reply, each carrying the conversation_id of the
            private thread it came from (already seeded with the broadcast as its
            top message, so opening it is a navigation, not a creation).
            recipients[] — one row per member it reached: { user_id, full_name,
            avatar_url, delivered (always true — a broadcast is written into every
            thread server-side in one transaction, so arrival is a fact, not a
            hope: ONE blue tick), delivered_at, seen (they opened the thread after
            it landed: TWO blue ticks), seen_at }.
            Plus delivered_count and seen_count.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "FORBIDDEN_SCOPE — not your broadcast" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/flag:
    post:
      tags: [progress]
      summary: Flag a message for review (Admin/SuperAdmin); soft — still visible to members.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { reason: { type: string } }
      responses:
        "200": { description: Moderation state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/unflag:
    post:
      tags: [progress]
      summary: Clear a message's flag (Admin/SuperAdmin).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Moderation state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/remove:
    post:
      tags: [progress]
      summary: Remove a message — hide it from members (Admin/SuperAdmin).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Moderation state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /chat/messages/{id}/restore:
    post:
      tags: [progress]
      summary: Restore a removed message — make it visible to members again (Admin/SuperAdmin).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Moderation state }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  /giving/paypal/capture:
    post:
      tags: [progress]
      summary: Capture a PayPal order the member approved (USD); settles the ledger on COMPLETED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties: { order_id: { type: string } }
      responses:
        "200": { description: Capture status }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Nuru AI assistant (mobile make) ---
  /assistant/chat:
    post:
      tags: [progress]
      summary: Ask Nuru — AI companion (summarize a chat, draft an encouragement, find prayer, plan quiet time). Grounds only on conversations the member can access.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, text]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string }
                conversation_id: { type: string, format: uuid }
      responses:
        "200": { description: Reply }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /assistant/history:
    get:
      tags: [progress]
      summary: My persisted Nuru thread (oldest→newest). Private to me.
      responses:
        "200": { description: Nuru thread }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Webhooks & sync (system) (§3.3) ---
  /webhooks/stripe:
    post:
      tags: [system]
      summary: Stripe event receiver; HMAC-verified + idempotent.
      security: []
      responses:
        "200": { description: Acknowledged }
  /webhooks/mobilemoney/{provider}:
    post:
      tags: [system]
      summary: M-Pesa/Airtel callback receiver; HMAC-verified + idempotent — settlement happens only here.
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [mpesa, airtel] } }
      responses:
        "200": { description: Acknowledged }
  /sync/pull:
    post:
      tags: [system]
      summary: Delta pull — cursors in, changed rows + tombstones + new cursors out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPullRequest" }
      responses:
        "200":
          description: Delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPullResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sync/push:
    post:
      tags: [system]
      summary: Replay the offline mutation queue; per-mutation results.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPushRequest" }
      responses:
        "200":
          description: Per-mutation results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncPushResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # --- Radio Broadcast Studio + Virtual Audio Mixer (docs/RADIO_STUDIO_CONTRACT.md) ---
  # Admin surface (/admin/radio/*, RBAC radio:*) returns RadioProgram WITH ingest
  # secrets; the member surface (/radio/*, auth) returns RadioProgramPublic, which
  # OMITS stream_key/ingest_url/ingest_provider. Private programs are never member-visible.
  /admin/radio/programs:
    get:
      tags: [radio]
      summary: List all programs (admin). Includes ingest secrets. Gated by radio:view.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, scheduled, live, ended] } }
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioProgram" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [radio]
      summary: Create a program; provisions ingest credentials. Gated by radio:create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRadioProgramBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/programs/{id}:
    get:
      tags: [radio]
      summary: Get a program (admin, incl. secrets). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Program
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [radio]
      summary: Update a program. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRadioProgramBody" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [radio]
      summary: Delete a program. Gated by radio:delete.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/reactions:
    get:
      tags: [radio]
      summary: Aggregate reaction totals for a program (all members) — heart/amen/fire counts for the console's interactions panel. Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                type: object
                required: [heart, amen, fire]
                properties:
                  heart: { type: integer }
                  amen: { type: integer }
                  fire: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/go-live:
    post:
      tags: [radio]
      summary: Go live — status=live, is_live=true; provider.start. Gated by radio:edit. Only ONE session can be on air — 409 (with live_program_id/title in details) while another is live; the auto-air sweep retries, so a scheduled session starts automatically when the current one ends.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Now live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another session is already live (details carry live_program_id + live_program_title) }
  /admin/radio/mic-bridge:
    get:
      tags: [radio]
      summary: "WebSocket upgrade (not plain HTTP): browser mic broadcasting. The console captures the mic (getUserMedia → MediaRecorder) and streams encoded chunks (binary frames) here; the server performs the Icecast SOURCE handshake against the liquidsoap harbor /mic input and pipes bytes through. Auth: ?token=<access JWT> (WS can't set headers) + radio:edit. ?ct= declares the encoding (audio/webm default; audio/mp4 for Safari). First server frame after the harbor accepts is {ok:true,mount}. Close codes: 4001 bad token · 4003 no permission · 4004 not configured · 4008 engine unreachable/no live session · 4409 mic input busy (someone already on mic)."
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string }, description: Access JWT (header auth is unavailable on WebSocket upgrades) }
        - { name: ct, in: query, required: false, schema: { type: string, enum: [audio/webm, audio/mp4, audio/aac, audio/mpeg, audio/ogg] } }
      responses:
        "101": { description: Switching Protocols — WebSocket session established }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/radio/schedule/conflicts:
    get:
      tags: [radio]
      summary: Pre-save overlap check for a proposed schedule slot — other scheduled sessions (and a live one's projected window) that intersect [scheduled_at, scheduled_at + duration_min). Sessions without a duration are assumed 60 min. Gated by radio:view.
      parameters:
        - { name: scheduled_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: duration_min, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
        - { name: exclude_id, in: query, required: false, schema: { type: string, format: uuid }, description: The program being edited (excluded from its own check) }
      responses:
        "200":
          description: Overlapping sessions (empty = the slot is clear)
          content:
            application/json:
              schema:
                type: object
                required: [conflicts]
                properties:
                  conflicts:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, is_live]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        scheduled_at: { type: [string, "null"], format: date-time }
                        duration_min: { type: [integer, "null"] }
                        status: { type: string, enum: [draft, scheduled, live, ended] }
                        is_live: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /admin/radio/programs/{id}/end:
    post:
      tags: [radio]
      summary: End — status=ended, is_live=false; provider.stop. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgram" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/rotate-key:
    post:
      tags: [radio]
      summary: Rotate the secret stream key. Gated by radio:edit.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: New stream key
          content:
            application/json:
              schema:
                type: object
                required: [stream_key]
                properties: { stream_key: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/radio/programs/{id}/health:
    get:
      tags: [radio]
      summary: Live stream health (live programs only). Gated by radio:view.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StreamHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
