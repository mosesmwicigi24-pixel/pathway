      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveLevelsBody" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Validation failed (at least one channel required) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/eq:
    post:
      tags: [radio]
      summary: Set live-mix 3-band EQ gains per bus (mic/bed/master × low/mid/high, dB −12..+12). Gated by radio:edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MixerLiveEqBody" }
      responses:
        "200": { description: Applied, content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } } }
        "400": { description: Validation failed (at least one band gain required; dB −12..+12) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "503": { description: Live mix engine not configured or unreachable }
