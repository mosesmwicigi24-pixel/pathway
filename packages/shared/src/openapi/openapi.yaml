      parameters:
        - name: disciple_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ data: [{ assignment_id, disciple_user_id, discipler_user_id, discipler_full_name, assigned_by, assigned_at, ended_at, end_reason }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/pastor-assignments:
    post:
      tags: [portal]
      summary: >-
        Name (or rename) a member's pastor, or a congregation's default
        pastoral account (Chat Redesign C2, "Talk with My Pastor"). Admin+.
        Ends the prior active row for the same key (member, or congregation
        default) before inserting the new one — history-preserving.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pastor_user_id]
              properties:
                member_user_id: { type: [string, "null"], format: uuid, description: "Omit/null for a congregation-wide default row (then assignment_kind must be default and congregation_id required)." }
                congregation_id: { type: string, format: uuid }
                pastor_user_id: { type: string, format: uuid }
                assignment_kind: { type: string, enum: [primary, campus, cell, default], default: primary }
      responses:
        "201": { description: "{ assignment_id, reassigned }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    get:
      tags: [portal]
      summary: A member's full pastor-assignment history, newest first. Admin+.
      parameters:
        - name: member_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ data: [{ assignment_id, member_user_id, congregation_id, pastor_user_id, pastor_full_name, assignment_kind, assigned_by, assigned_at, ended_at }] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

