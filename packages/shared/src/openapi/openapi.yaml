        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: Jingle has no server-hosted audio — re-upload it }
        "503": { description: Live mix engine not configured or unreachable }
  /admin/radio/mixer/live/scene:
    post:
      tags: [radio]
      summary: Apply a saved mixer scene to the live mix (mic→mic, music→bed, jingle→jingle, master→master; other channels ignored). Gated by radio:edit.
      requestBody:
