        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }

  # --- Radio member surface (auth only; public projection, no ingest secrets) ---
  /radio/programs:
    get:
      tags: [radio]
      summary: Visible programs (public always; members if authed; never private).
      responses:
        "200":
          description: Programs
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioProgramPublic" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /radio/now-playing:
    get:
      tags: [radio]
      summary: Current live program, or the next scheduled one (null if none). No stream_key.
      responses:
        "200":
          description: Now playing (or null)
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/RadioProgramPublic" }
                  - { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /radio/programs/{id}:
    get:
      tags: [radio]
      summary: Program public view (hls_url yes, stream_key NO). 404 for private.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Program (public projection)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioProgramPublic" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/listening:
    post:
      tags: [radio]
      summary: >-
        Listener presence heartbeat. The member player POSTs this ~every 20s
        while it is actually playing this live program; idempotent upsert of the
        caller's (program,user,last_seen=now). Stops when playback stops.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Heartbeat recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/listeners:
    get:
      tags: [radio]
      summary: >-
        Live listener roster — real members active within the last 45s (most
        recent first, capped at 100) plus the real active count. Drives the
        studio's Live listeners panel and count.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Active listener roster
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioListenerRoster" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/react:
    post:
      tags: [radio]
      summary: React (heart|amen|fire). Idempotent per client_event_id (§2.1/§3.6).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioReactBody" }
      responses:
        "200":
          description: Reaction counts
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties: { counts: { $ref: "#/components/schemas/RadioReactionCounts" } }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /radio/programs/{id}/comments:
    get:
      tags: [radio]
      summary: Non-hidden comments, newest first.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RadioComment" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [radio]
      summary: Post a comment. Idempotent per client_event_id (§2.1/§3.6).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadioCommentBody" }
      responses:
        "201":
          description: Comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadioComment" }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # --- Nuru Live (docs/LIVE_STREAMING.md, phase L1) — self-hosted MediaMTX;
  # L0 infra (RTMP ingest, HLS out, fMP4 recordings) already lives on the VPS. ---
  /live/streams:
    post:
      tags: [live]
      summary: >-
        Mint a stream + one-time publish key (permission live:go). Church scope
        additionally requires the caller be staff (the "unscoped" grant); cell
        scope requires Admin/SuperAdmin or the cell in the caller's
        leader_assignments. Refused if that scope target already has a live
        stream (409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, title, kind]
              properties:
                scope: { type: string, enum: [church, cell] }
                cell_id: { type: string, format: uuid, description: "Required when scope=cell; omitted for scope=church." }
                title: { type: string, maxLength: 200 }
                kind: { type: string, enum: [video, audio] }
      responses:
        "201":
          description: Minted stream + publish credentials
          content:
            application/json:
              schema:
                type: object
                required: [stream_id, rtmp_url, stream_key, path]
                properties:
                  stream_id: { type: string, format: uuid }
                  rtmp_url: { type: string, description: "Publish target; the broadcaster appends ?user=<stream_id>&pass=<stream_key>." }
                  stream_key: { type: string, description: "One-time plaintext publish key — only sha256 is stored server-side." }
                  path: { type: string, description: "MediaMTX path — 'church' or 'cell/{cell_id}'." }
        "400": { description: Validation failed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { description: "NOT_FOUND — unknown cell_id." }
        "409": { description: "CONFLICT — that scope target already has a live stream." }
  /live/auth:
    post:
      tags: [live]
      summary: >-
        MediaMTX authHTTP webhook (UNAUTHENTICATED — no bearer JWT; MediaMTX has
        no user session, only the stream's own publish key or a guest token.
        Reachable only from localhost in prod). action=publish on a
        church/cell path validates stream_id/password/path strictly against
        live_streams; other church/cell actions (read/playback/…) are left
        open. L6a (docs/LIVE_INTERACTIVE.md): on a guest WebRTC path
        (path="guest/{streamId}/{userId}"), action=publish is allowed only
        for that (stream,user)'s 'accepted' guest row presenting its own
        matching guest_token while the stream is live; action=read is allowed
        for either the stream's own owner publish key or any 'accepted'
        guest's own token on the SAME stream (guests may preview each other).
        Every other action on any path is left open, unchanged.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, path, action]
              properties:
                user: { type: string, description: "The stream_id." }
                password: { type: string }
                path: { type: string }
                action: { type: string }
      responses:
        "200": { description: Authorized }
        "401": { description: Rejected }
  /live/streams/{id}/end:
    post:
      tags: [live]
      summary: End a live stream — the broadcaster, a live:manage holder, or Admin/SuperAdmin. Idempotent. Best-effort inline recording registration.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: "{ stream_id, status, ended_at }"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /live/now:
    get:
      tags: [live]
      summary: >-
        Streams currently live that the caller may watch — church always; cell
        streams only for that cell's members (or Admin/SuperAdmin/live:manage).
        L1.5 (infinite fan-out, docs/LIVE_STREAMING.md): when the server has
        LIVE_CDN_BASE configured, a church-scope row's hls_url is the ABSOLUTE
        Cloudflare R2 CDN URL (a VPS-local publisher daemon mirrors the church
        HLS playlist/segments there) and an additional hls_fallback_url field
        carries the direct relative URL for clients to fail over to if the CDN
        copy 404s. Without LIVE_CDN_BASE, or for cell-scope rows, hls_url is
        always the direct relative URL and hls_fallback_url is absent. L1.5b
        (docs/LIVE_CDN_PERSTREAM.md): when the server ALSO has
        LIVE_CDN_PER_STREAM enabled, the church hls_url is scoped by
        stream_id ("<LIVE_CDN_BASE>/live-cdn/church/<stream_id>/index.m3u8")
        instead of the legacy static path — fixes a flicker bug where a new
        broadcast could briefly serve the previous stream's cached CDN
        manifest/segments. Default off; hls_fallback_url is unaffected either
        way.
      responses:
        "200":
          description: "{ data: [{ stream_id, scope, cell_id, title, kind, started_at, hls_url, hls_fallback_url?, started_by_name, viewer_count }, ...] }"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /live/church/current:
    get:
      tags: [live]
      summary: >-
        L1.5b (docs/LIVE_CDN_PERSTREAM.md): the currently-live church stream's
        id, or null. Deliberately UNAUTHENTICATED — same trust boundary as the
        MediaMTX authHTTP webhook (POST /live/auth): meant to be reachable
        only from the VPS's own loopback, polled by the CDN publisher daemon
        (ops/live-cdn/publisher.py) to learn which stream_id to mirror
        per-stream CDN objects under. Reveals nothing a member's own GET
        /live/now wouldn't already show.
      responses:
        "200":
          description: "{ stream_id: string | null }"
  /live/streams/{id}/heartbeat:
    post:
      tags: [live]
      summary: Viewer presence heartbeat — upserts (stream, caller, last_seen=now), updates viewer_peak, opportunistically prunes stale rows.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: "{ ok: true }"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /live/recordings:
    get:
      tags: [live]
      summary: Ended streams with a registered recording (VOD), same visibility rules as /live/now.
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [church, cell] }
        - name: cell_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "{ data: [{ stream_id, scope, cell_id, title, kind, started_at, ended_at, recording_url }, ...] }"
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---- Recording stewardship (owner-managed keep/delete) --------------------
  /live/recordings/mine:
    get:
      tags: [live]
      summary: >-
        Recordings belonging to streams the caller started; a live:manage
        holder instead sees every non-deleted recording (oversight). A
        "recording" is 1:1 with the stream that produced it, so recording_id
        equals stream_id — there is no separate recordings table.
        duration/size are not modeled anywhere in this schema and are
        deliberately omitted rather than fabricated. Newest (by ended_at)
        first.
      responses:
        "200":
          description: "{ data: [{ recording_id, stream_id, scope, cell_id, title, kind, started_at, ended_at, url }, ...] }"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /live/recordings/{id}:
    delete:
      tags: [live]
      summary: >-
        Delete (hide) one recording — the stream's own owner or a live:manage
        holder. SOFT-delete only: sets recording_deleted_at and the row is
        excluded from /live/recordings and /live/recordings/mine everywhere
        after; the on-disk file is not removed (see OPS FOLLOW-UP in
        src/modules/live/index.ts — neither the api nor worker container
        currently mounts the MediaMTX recordings directory). Idempotent — a
        repeat delete of an already-deleted recording is a silent no-op, not
        an error. 404 if the stream doesn't exist or never had a recording.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "204": { description: Recording deleted (or already deleted) }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---- L5 interactions (docs/LIVE_INTERACTIVE.md) — PINNED wire contract ----
  /live/streams/{id}/reactions:
    post:
      tags: [live]
      summary: >-
        Append a like/love/fire reaction event. Server-rate-limited to >=1s/user
        (429 RATE_LIMITED on a faster repeat). 409 CONFLICT once the stream
        has ended.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, enum: [like, love, fire] }
      responses:
        "204": { description: Reaction recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { description: "RATE_LIMITED — faster than one reaction per second." }
  /live/streams/{id}/hand:
    post:
      tags: [live]
      summary: >-
        Idempotent upsert of one raise-hand state per (stream, caller). 409
        CONFLICT once the stream has ended.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raised]
              properties:
                raised: { type: boolean }
      responses:
        "204": { description: Hand state updated }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /live/streams/{id}/messages:
    get:
      tags: [live]
      summary: >-
        Live chat, ascending, capped at 200/poll. Allowed while the stream has
        ended (grace read for the client's last poll).
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - name: since
          in: query
          description: ISO 8601 timestamp cursor; omit for the most recent 200.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: "{ messages: [{ message_id, user_id, full_name, avatar_url, body, sent_at }, ...] }"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [live]
      summary: Send a live chat message (trimmed, 1-500 chars). 409 CONFLICT once the stream has ended.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: "{ message_id, user_id, full_name, avatar_url, body, sent_at }"
        "400": { description: Validation failed — empty or over 500 chars. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /live/streams/{id}/pulse:
    get:
      tags: [live]
      summary: >-
        One snapshot for the whole interactive overlay — viewer_count (same
        window as /live/now), reaction totals + last ~20 events, currently
        raised hands, and active (invited/accepted) guests. Poll every 3s
        (broadcaster) / 5s (viewer). Allowed while the stream has ended (grace
        read).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: >-
            { viewer_count, reactions: { like, love, fire }, recent_reactions:
            [{ emoji, at }, ...], hands: [{ user_id, full_name, avatar_url,
            raised_at }, ...], guests: [{ user_id, full_name, avatar_url,
            status, whep_url? }, ...] }. L6a (docs/LIVE_INTERACTIVE.md):
            whep_url is ADDITIVE and owner-only — present on each guest entry
            only when the caller is the stream's own broadcaster (the device
            that subscribes to each guest's WebRTC feed to composite it
            locally); absent for every other caller, including the guests
            themselves.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /live/streams/{id}/guests/{userId}:
    post:
      tags: [live]
      summary: >-
        Invite a viewer as an L6 on-stage guest — broadcaster only, cap 6
        active (invited+accepted), target may not be the broadcaster
        themselves. Re-inviting an already invited/accepted guest is an
        idempotent no-op. Rides the existing push path (template
        `live_guest_invite`) to knock the invitee even if backgrounded. 409
        CONFLICT once the stream has ended, or once the cap is reached.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/UserIdPath" }
      responses:
        "204": { description: Invited }
        "400": { description: "VALIDATION_FAILED — target is the broadcaster." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [live]
      summary: >-
        Remove a guest — the broadcaster, or the guest themselves (leave).
        Idempotent (an already-terminal or never-invited row is a silent
        no-op). 409 CONFLICT once the stream has ended.
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/UserIdPath" }
      responses:
        "204": { description: Removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /live/streams/{id}/guests/respond:
    post:
      tags: [live]
      summary: >-
        Accept or decline a pending guest invite — invitee only. 404 if there
        is no invite currently in 'invited' status for the caller. 409
        CONFLICT once the stream has ended.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        "204": { description: Response recorded }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---- L6a — guest WebRTC publish authorization (docs/LIVE_INTERACTIVE.md) --
  /live/streams/{id}/guests/me/ingest:
    get:
      tags: [live]
      summary: >-
        The caller's own WHIP publish credentials for this stream's guest
        slot — call once accepted, before starting the WebRTC publish.
        403 unless the caller is currently an 'accepted' guest of a LIVE
        stream (never invited, still 'invited', declined, removed, or the
        stream has since ended all 403 here).
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: >-
            { whip_url, token, path }. whip_url =
            "<LIVE_WEBRTC_BASE_URL>/guest/{id}/{callerUserId}/whip" — the
            caller WHIP-publishes camera+mic there, authenticating with
            `token` (query/user-pass credentials, matching the existing
            rtmp_url convention). `path` is the bare MediaMTX path, same value
            embedded in whip_url.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserIdPath:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, default: 50, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  responses:
    Conflict:
      description: Optimistic-concurrency clash; current value returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GateLocked:
      description: Content or action blocked by the gating engine.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ForbiddenScope:
      description: Authenticated but not authorised for this resource.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid, or expired credentials.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Well-formed but semantically invalid (e.g. unknown cell group).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamUnavailable:
      description: A required dependency (e.g. the IdP) is unreachable or not configured.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Permission:
      type: object
      description: A single RBAC (module × capability) cell. 16 fixed modules × 6 capabilities.
      required: [module_id, capability]
      properties:
        module_id:
          type: string
          enum: [dashboard, levels, cms, quiz, videos, cells, members, reflections, events, finance, certificates, badges, users, rolesAdmin, countries, languages, congregations]
        capability:
          type: string
          enum: [view, create, edit, delete, approve, export]
    HubScores:
      type: object
      description: Growth scores, 0–100 ints; null if not yet computed.
      required: [overall, word, prayer, habits, curriculum, attendance]
      properties:
        overall: { type: [integer, "null"] }
        word: { type: [integer, "null"] }
        prayer: { type: [integer, "null"] }
        habits: { type: [integer, "null"] }
        curriculum: { type: [integer, "null"] }
        attendance: { type: [integer, "null"] }
    MyDiscipleship:
      type: object
      required: [discipler, dm_conversation_id, can_message, progression, scores, reflections, next_meeting_at, notes]
      properties:
        discipler:
          type: [object, "null"]
          required: [user_id, full_name, avatar_url, role_label, cell_name, established_at]
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            avatar_url: { type: [string, "null"] }
            role_label: { type: string, enum: [Cell Leader, Discipler] }
            cell_name: { type: [string, "null"] }
            established_at: { type: [string, "null"], format: date-time }
        dm_conversation_id:
          type: [string, "null"]
          format: uuid
          description: Present only if a DM already exists; a GET never creates one.
        can_message: { type: boolean, description: false for minors (chat blocks minors). }
        progression:
          type: object
          required: [current_level, level_title, streak_days, modules_completed, modules_total, awaiting_review, awaiting_level]
          properties:
            current_level: { type: integer }
            level_title: { type: string }
            streak_days: { type: integer }
            modules_completed: { type: integer }
            modules_total: { type: integer }
            awaiting_review: { type: boolean }
            awaiting_level: { type: [integer, "null"] }
        scores: { $ref: "#/components/schemas/HubScores" }
        reflections:
          type: array
          description: The member's own reflections, most-recent first, cap 20. Never exposes pastoral_note.
          items:
            type: object
            required: [module_id, module_title, level_number, state, submitted_at, feedback_notes]
            properties:
              module_id: { type: string, format: uuid }
              module_title: { type: string }
              level_number: { type: integer }
              state: { type: string, enum: [approved, pending, returned, deferred] }
              submitted_at: { type: string, format: date-time }
              feedback_notes: { type: [string, "null"] }
        next_meeting_at: { type: [string, "null"], format: date-time }
        notes:
          type: array
          items:
            type: object
            required: [topic, body, met_at, next_meeting_at]
            properties:
              topic: { type: string }
              body: { type: string }
              met_at: { type: string, format: date-time }
              next_meeting_at: { type: [string, "null"], format: date-time }
    DiscipleRosterRow:
      type: object
      required: [user_id, full_name, avatar_url, cell_name, cell_group_id, current_level, band, streak_days, days_since_last_activity, pending_reflections, awaiting_level]
      properties:
        user_id: { type: string, format: uuid }
        full_name: { type: string }
        avatar_url: { type: [string, "null"] }
        cell_name: { type: [string, "null"] }
        cell_group_id: { type: [string, "null"], format: uuid }
        current_level: { type: integer }
        band: { type: [string, "null"], enum: [thriving, steady, watch, at_risk, null] }
        streak_days: { type: integer }
        days_since_last_activity: { type: [integer, "null"] }
        pending_reflections: { type: integer }
        awaiting_level: { type: [integer, "null"] }
    DiscipleDossier:
      type: object
      required: [member, progression, scores, engagement, reflections, recent_activity, dm_conversation_id]
      properties:
        member:
          type: object
          required: [user_id, full_name, avatar_url, cell_name, established_at, joined_at]
          properties:
            user_id: { type: string, format: uuid }
            full_name: { type: string }
            avatar_url: { type: [string, "null"] }
            cell_name: { type: [string, "null"] }
            established_at: { type: [string, "null"], format: date-time }
            joined_at: { type: [string, "null"], format: date-time }
        progression:
          type: object
          required: [current_level, level_title, streak_days, modules_completed, modules_total, awaiting_level]
          properties:
            current_level: { type: integer }
            level_title: { type: string }
            streak_days: { type: integer }
            modules_completed: { type: integer }
            modules_total: { type: integer }
            awaiting_level: { type: [integer, "null"] }
        scores: { $ref: "#/components/schemas/HubScores" }
        engagement:
          type: object
          required: [e_score, band, days_since_last_activity]
          properties:
            e_score: { type: [integer, "null"], description: 0–100 (engagement Eᵢ ×100). }
            band: { type: [string, "null"], enum: [thriving, steady, watch, at_risk, null] }
            days_since_last_activity: { type: [integer, "null"] }
        reflections:
          type: array
          description: Discipler DOES see body + feedback_notes (pastoral). Most-recent first, cap 20.
          items:
            type: object
            required: [reflection_id, module_id, module_title, level_number, state, submitted_at, body, feedback_notes]
            properties:
              reflection_id: { type: string, format: uuid }
              module_id: { type: string, format: uuid }
              module_title: { type: string }
              level_number: { type: integer }
              state: { type: string, enum: [approved, pending, returned, deferred] }
              submitted_at: { type: string, format: date-time }
              body: { type: string }
              feedback_notes: { type: [string, "null"] }
        recent_activity:
          type: array
          description: Last ~20 interaction_events.
          items:
            type: object
            required: [kind, occurred_at]
            properties:
              kind: { type: string }
              occurred_at: { type: string, format: date-time }
        dm_conversation_id: { type: [string, "null"], format: uuid }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details: { type: object, additionalProperties: true }

    Ok:
      type: object
      required: [ok]
      properties: { ok: { type: boolean, enum: [true] } }

