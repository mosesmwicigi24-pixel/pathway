        [id, title, category, tags, visibility, status, is_live, record_broadcast,
         peak_listeners, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        category: { type: string, enum: [Sermon, Worship, Prayer, "Bible Study", Conference] }
        speaker: { type: [string, "null"] }
        location: { type: [string, "null"] }
        artwork_url: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        visibility: { type: string, enum: [public, members, private] }
        scheduled_at: { type: [string, "null"], format: date-time }
        duration_min: { type: [integer, "null"] }
        repeat: { type: [string, "null"] }
        timezone: { type: [string, "null"] }
        status: { type: string, enum: [draft, scheduled, live, ended] }
        loop_mode: { type: string, enum: [none, loop_all, repeat_one] }
        is_live: { type: boolean }
        live_started_at: { type: [string, "null"], format: date-time }
        live_ended_at: { type: [string, "null"], format: date-time }
        audio_url: { type: [string, "null"] }
        audio_duration_sec: { type: [integer, "null"] }
        auto_go_live: { type: boolean }
        record_broadcast: { type: boolean }
        record_target: { type: [string, "null"], enum: [cloud, local, both, null] }
        peak_listeners: { type: integer }
        hls_url: { type: [string, "null"] }
        tracks:
          type: array
