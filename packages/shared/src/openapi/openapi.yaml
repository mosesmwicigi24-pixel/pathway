  # --- Discipleship Hub (read-aggregation composition layer; no new tables) ---
  /me/discipleship:
    get:
      tags: [progress]
      summary: My Discipleship Hub — discipler, progression, scores, reflections (self).
      description: >-
        Single call powering the member Hub. Resolves the discipler (explicit
        relationship_tree edge, else cell leader), progression at the current
        level, growth scores, and the member's own reflections. Pure GET — never
        creates a DM. can_message is false for minors.
      responses:
        "200":
          description: My Discipleship Hub
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/MyDiscipleship" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /disciples:
    get:
      tags: [portal]
      summary: A discipler's roster + triage across all their cells + relationship edges.
      description: >-
        Instructor+; scoped to the caller's disciple set (union of relationship_tree
        edges + members of cells in leader_assignments). Admin/SuperAdmin see all
        students. Sorted with action-needed students first.
      responses:
        "200":
          description: Roster + triage summary
          content:
            application/json:
              schema:
                type: object
                required: [data, summary]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DiscipleRosterRow" } }
                  summary:
                    type: object
                    required: [total_students, awaiting_action]
                    properties:
                      total_students: { type: integer }
                      awaiting_action: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
  /disciples/{id}:
    get:
      tags: [portal]
      summary: One student's full journey for their discipler (Instructor-scoped dossier).
      description: >-
        403 FORBIDDEN_SCOPE if the student is not in the caller's disciple set.
        The discipler DOES see reflection bodies + feedback_notes (pastoral),
        unlike the member's own Hub. Admin/SuperAdmin unrestricted.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Student dossier
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/DiscipleDossier" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/discipler-assignments:
    post:
      tags: [portal]
      summary: >-
        Assign (or REASSIGN) a member's discipler (Chat Redesign C2) —
        history-preserving, unlike the one-shot POST /relationships. Ends the
        disciple's prior active row (end_reason=reassigned) and archives the
        OLD DISCIPLER conversation between disciple and former discipler
        (chat_conversations.archived_at) — never merged into or exposed via
        the new assignment. Scope: assertCellInScope (Instructor+, scoped to
        the disciple's cell; Admin/SuperAdmin unrestricted) — same authority
        as POST /relationships.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disciple_user_id, discipler_user_id]
              properties:
                disciple_user_id: { type: string, format: uuid }
                discipler_user_id: { type: string, format: uuid }
      responses:
        "201": { description: "{ assignment_id, disciple_user_id, discipler_user_id, reassigned }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
