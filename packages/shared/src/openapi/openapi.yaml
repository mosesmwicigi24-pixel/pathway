  /me/activity/screens:
    post:
      tags: [auth]
      summary: >-
        Batch-submit app-area dwell events (parity gap #3). Best-effort usage
        telemetry: the mobile/iPad client posts up to 200 per-screen dwell
        durations for the authenticated member. Idempotent on client_event_id —
        an offline replay of the same batch is a no-op. Malformed rows are
        clamped/skipped server-side rather than rejected. Returns { accepted },
        the number of newly-stored events. Feeds engagement.area_dwell.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [screen, duration_ms, occurred_at, client_event_id]
                    properties:
                      screen: { type: string, maxLength: 40 }
                      duration_ms: { type: integer, minimum: 0, maximum: 86400000 }
                      occurred_at: { type: string, format: date-time }
                      client_event_id: { type: string, format: uuid }
      responses:
        "200":
          description: Accepted count
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  # --- Announcements (Contract Matrix B5) ---
  /admin/announcements:
    get:
      tags: [announcements]
      summary: Admin. List announcements with delivered/open counts.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [draft, scheduled, sent, cancelled] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Announcements }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
    post:
      tags: [announcements]
      summary: Admin. Compose an announcement (draft, or scheduled when scheduled_at is set).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCompose" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /admin/announcements/{id}:
    get:
      tags: [announcements]
      summary: Admin. Announcement detail with per-channel delivered/open stats.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Announcement + stats }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [announcements]
      summary: Admin. Edit a draft/scheduled announcement; 409 once sent or cancelled.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementCompose" }
      responses:
        "200": { description: Updated }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [announcements]
      summary: Admin. Soft-delete an announcement (any status); removes it from lists, the member feed, and the homepage feature.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Deleted }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/announcements/{id}/duplicate:
    post:
      tags: [announcements]
      summary: >-
        Admin. Duplicate → a fresh draft clone (also "resend" = duplicate + send,
        and "use as template" — no separate template entity).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "201": { description: Draft clone }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/announcements/{id}/archive:
    post:
      tags: [announcements]
      summary: >-
        Admin. Archive (distinct from delete) — leaves the default list and the
        member feed, history preserved. A scheduled announcement must be
        cancelled first (409).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Archived }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/announcements/{id}/restore:
    post:
      tags: [announcements]
      summary: Admin. Restore an archived announcement.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Restored }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/announcements/{id}/send:
    post:
      tags: [announcements]
      summary: >-
        Admin. Send now — fans out per recipient×channel (idempotent),
        congregation-scoped audience. Channel honesty: push rides notifications
        (quiet hours/caps), email rides the SMTP EmailProvider (delivered = SMTP
        accepted), sms/whatsapp record suppressed(no_provider) until a provider
        exists, banner is delivered in-app.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Fan-out summary }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /admin/announcements/{id}/cancel:
    post:
      tags: [announcements]
      summary: Admin. Cancel a draft/scheduled announcement; 409 once sent.
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200": { description: Cancelled }
        "403": { $ref: "#/components/responses/ForbiddenScope" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/announcements:
    get:
      tags: [announcements]
      summary: My in-app (banner) announcements, newest first, unexpired.
      responses:
        "200": { description: Announcements }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /announcements/{id}/open:
    post:
      tags: [announcements]
      summary: Open receipt — stamps opened_at on my deliveries (idempotent).
