# Local-only override (auto-loaded by `docker compose`). Not for committing —
# host port 8080 is used by a local `tsx` dev server, so the containerized API
# is published on 8081 instead. Container-internal port is unchanged (8080).
services:
  api:
    # !override replaces the base ports list instead of appending to it
    # (Compose merges sequences additively by default).
    ports: !override
      - "8082:8080"
  # The worker has no HTTP server, so the image's /healthz HEALTHCHECK (meant for
  # the API) always fails and shows "unhealthy". Disable it for the worker.
  worker:
    healthcheck:
      disable: true
